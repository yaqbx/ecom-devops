replicas: 1
image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 80
  targetPort: 3000
env: []
envFrom: []
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
livenessProbe:
  path: /health
  port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  path: /health
  port: 3000
  initialDelaySeconds: 5
  periodSeconds: 5
configmap:
  enabled: false
  data: {}
secret:
  enabled: false
  data: {}
