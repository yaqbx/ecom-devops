apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ecommerce
  namespace: argocd
spec:
  description: E-commerce microservices project
  sourceRepos:
    - https://github.com/lukaszjakubowski/ecom-devops
  destinations:
    - namespace: ecommerce
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  orphanedResources:
    warn: false
