name: Build & Push App Images
on:
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [product-catalog, user-management, checkout-service, frontend, payment-mock]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::163841615263:role/app-build-role
          aws-region: eu-north-1
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Extract short commit SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Build image
        run: docker build -t ${{ matrix.service }}:${{ steps.sha.outputs.short_sha }} apps/${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:${{ steps.sha.outputs.short_sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Tag and Push to ECR
        run: |
          docker tag ${{ matrix.service }}:${{ steps.sha.outputs.short_sha }} ${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/${{ matrix.service }}:v1.0.0-${{ steps.sha.outputs.short_sha }}
          docker push ${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/${{ matrix.service }}:v1.0.0-${{ steps.sha.outputs.short_sha }}
 
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4        
          
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::163841615263:role/app-build-role
          aws-region: eu-north-1
      
      - name: Extract short commit SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name ecom-devops-eks --region eu-north-1
          helm repo add eks https://aws.github.io/eks-charts
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            -n kube-system \
            --set clusterName=ecom-devops-eks \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set region=eu-north-1 \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=arn:aws:iam::163841615263:role/ecom-devops-eks-alb-controller

          echo "=== ALB Controller pods ==="
          kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller
          kubectl wait -n kube-system --for=condition=available deployment/aws-load-balancer-controller --timeout=120s || {
            echo "=== ALB Controller pod status ==="
            kubectl describe pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller
            echo "=== ALB Controller logs ==="
            kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller --tail=50 || true
            exit 1
          }

          kubectl apply -n dev -f k8s/namespace/
          kubectl apply -n dev -f k8s/configmaps/
          kubectl apply -n dev -f k8s/secrets/
          kubectl apply -n dev -f k8s/databases/
          kubectl apply -n dev -f k8s/microservices/
          

          for service in product-catalog user-management checkout-service frontend payment-mock; do
            kubectl set image deployment/$service $service=${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/$service:v1.0.0-${{ steps.sha.outputs.short_sha }} -n dev
          done
  
  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: deploy
    environment: prod
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::163841615263:role/app-build-role
          aws-region: eu-north-1

      - name: Extract short commit SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Deploy to Prod
        run: |
          aws eks update-kubeconfig --name ecom-devops-eks --region eu-north-1
          kubectl apply -n prod -f k8s/namespace/prod-namespace.yaml
          kubectl apply -n prod -f k8s/configmaps/
          kubectl apply -n prod -f k8s/secrets/
          kubectl apply -n prod -f k8s/databases/
          kubectl apply -n prod -f k8s/microservices/
          for service in product-catalog user-management checkout-service frontend payment-mock; do
            kubectl set image deployment/$service $service=${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/$service:v1.0.0-${{ steps.sha.outputs.short_sha }} -n prod
          done