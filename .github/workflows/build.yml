name: Build & Push App Images
on:
  push:
    branches: [ main ]
    paths:
      - 'apps/**'
      - '.github/workflows/build.yml'

  workflow_dispatch:
jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::163841615263:role/app-build-role
          aws-region: eu-north-1
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Extract short commit SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Build Product Catalog
        run: |
          docker build -t product-catalog:${{ steps.sha.outputs.short_sha }} apps/product-catalog
          docker tag product-catalog:${{ steps.sha.outputs.short_sha }} ${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/product-catalog:v1.0.0-${{ steps.sha.outputs.short_sha }}
          docker push ${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/product-catalog:v1.0.0-${{ steps.sha.outputs.short_sha }}
      
      - name: Build User Management
        run: |
          docker build -t user-management:${{ steps.sha.outputs.short_sha }} apps/user-management
          docker tag user-management:${{ steps.sha.outputs.short_sha }} ${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/user-management:v1.0.0-${{ steps.sha.outputs.short_sha }}
          docker push ${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/user-management:v1.0.0-${{ steps.sha.outputs.short_sha }}
      
      - name: Build Checkout Service
        run: |
          docker build -t checkout-service:${{ steps.sha.outputs.short_sha }} apps/checkout-service
          docker tag checkout-service:${{ steps.sha.outputs.short_sha }} ${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/checkout-service:v1.0.0-${{ steps.sha.outputs.short_sha }}
          docker push ${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/checkout-service:v1.0.0-${{ steps.sha.outputs.short_sha }}
      
      - name: Build Frontend
        run: |
          docker build -t frontend:${{ steps.sha.outputs.short_sha }} apps/frontend
          docker tag frontend:${{ steps.sha.outputs.short_sha }} ${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/frontend:v1.0.0-${{ steps.sha.outputs.short_sha }}
          docker push ${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/frontend:v1.0.0-${{ steps.sha.outputs.short_sha }}

      - name: Build Payment Mock
        run: |
          docker build -t payment-mock:${{ steps.sha.outputs.short_sha }} apps/payment-mock
          docker tag payment-mock:${{ steps.sha.outputs.short_sha }} ${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/payment-mock:v1.0.0-${{ steps.sha.outputs.short_sha }}
          docker push ${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/payment-mock:v1.0.0-${{ steps.sha.outputs.short_sha }}
      
      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name ecom-devops-eks --region eu-north-1
          helm repo add eks https://aws.github.io/eks-charts
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            -n kube-system \
            --set clusterName=ecom-devops-eks \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set region=eu-north-1 \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=arn:aws:iam::163841615263:role/ecom-devops-eks-alb-controller

          echo "=== ALB Controller pods ==="
          kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller
          kubectl wait -n kube-system --for=condition=available deployment/aws-load-balancer-controller --timeout=120s || {
            echo "=== ALB Controller pod status ==="
            kubectl describe pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller
            echo "=== ALB Controller logs ==="
            kubectl logs -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller --tail=50 || true
            exit 1
          }

          kubectl apply -f k8s/namespace/
          kubectl apply -f k8s/configmaps/
          kubectl apply -f k8s/secrets/
          kubectl apply -f k8s/databases/
          kubectl apply -f k8s/microservices/
          kubectl apply -f k8s/ingress/
          kubectl set image deployment/product-catalog product-catalog=${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/product-catalog:v1.0.0-${{ steps.sha.outputs.short_sha }} -n ecommerce
          kubectl set image deployment/user-management user-management=${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/user-management:v1.0.0-${{ steps.sha.outputs.short_sha }} -n ecommerce
          kubectl set image deployment/checkout-service checkout-service=${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/checkout-service:v1.0.0-${{ steps.sha.outputs.short_sha }} -n ecommerce
          kubectl set image deployment/frontend frontend=${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/frontend:v1.0.0-${{ steps.sha.outputs.short_sha }} -n ecommerce
          kubectl set image deployment/payment-mock payment-mock=${{ vars.AWS_ACCOUNT_ID || '163841615263' }}.dkr.ecr.eu-north-1.amazonaws.com/payment-mock:v1.0.0-${{ steps.sha.outputs.short_sha }} -n ecommerce
