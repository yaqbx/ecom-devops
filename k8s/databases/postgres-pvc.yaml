# ============================================
# RESOURCE: PersistentVolumeClaim
# NAME: postgres-pvc
# PURPOSE: Requests storage for PostgreSQL data
# ============================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: gp2
