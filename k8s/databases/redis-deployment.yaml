# ============================================
# RESOURCE: Deployment
# SERVICE: Redis
# PURPOSE: Runs Redis cache for Checkout Service
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ecommerce
  labels:
    app: redis
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      tier: cache
  template:
    metadata:
      labels:
        app: redis
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # REDIS IMAGE:
          # - redis:7 = Redis version 7
          # - -alpine = Lightweight Alpine base
          # - Redis is in-memory cache (no persistence needed for testing)
          
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
          
          resources:
            requests:
              memory: "128Mi"  # Redis needs less memory
              cpu: "0.1"
            limits:
              memory: "256Mi"
              cpu: "0.25"
          
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
