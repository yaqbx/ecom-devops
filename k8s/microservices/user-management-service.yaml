# ============================================
# RESOURCE: Service
# NAME: user-management
# TYPE: ClusterIP
# PURPOSE: Exposes User Management API internally
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: user-management
  labels:
    app: user-management
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: user-management
    tier: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
