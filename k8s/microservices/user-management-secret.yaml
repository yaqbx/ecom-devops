# ============================================
# RESOURCE: Secret
# NAME: user-management-secret
# PURPOSE: Sensitive configuration for User Management
# ============================================
#
# WHAT IS A SECRET?
# - Stores sensitive data (passwords, API keys)
# - Base64 encoded (NOT encrypted by default!)
# - Better than plain text in ConfigMaps
# - Can enable encryption at rest for extra security
#
# SECURITY NOTES:
# - Base64 is encoding, not encryption
# - Anyone with kubectl access can decode
# - For production: enable encryption at rest
# - Better: use external secret manager (AWS Secrets Manager, Vault)
#
apiVersion: v1
kind: Secret
metadata:
  name: user-management-secret
  namespace: ecommerce
  labels:
    app: user-management
type: Opaque
# TYPE EXPLAINED:
# - Opaque = arbitrary user-defined data
# - Other types: kubernetes.io/tls, kubernetes.io/dockerconfigjson
# - Most secrets use type: Opaque

data:
  SECRET_KEY: "ZGphbmdvLWluc2VjdXJlLXNlY3JldC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24="
  # SECRET_KEY EXPLAINED:
  # - Django requires this for cryptographic signing
  # - Base64 encoded: "django-insecure-secret-key-change-in-production"
  # - FOR PRODUCTION: Generate strong random key
  # - Example: python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())'
