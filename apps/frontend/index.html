<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heavy Equipment Rental</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🏗️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="#" class="nav-brand" onclick="showPage('catalog')">🏗️ HeavyEquip</a>
      <div class="nav-links">
        <a href="#" onclick="showPage('catalog')">Catalog</a>
        <a href="#" onclick="showPage('quotes')">My Quotes</a>
        <a href="#" onclick="showPage('orders')">My Orders</a>
        <span id="auth-section">
          <a href="#" onclick="showPage('login')" id="login-link">Login</a>
        </span>
      </div>
    </div>
  </nav>

  <main class="container">
    <div id="page-catalog" class="page active">
      <h1>Equipment Catalog</h1>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search equipment..." oninput="searchEquipment()">
        <select id="category-filter" onchange="searchEquipment()">
          <option value="">All Categories</option>
        </select>
      </div>
      <div id="equipment-list" class="equipment-grid"></div>
    </div>

    <div id="page-quotes" class="page">
      <h1>My Quotes</h1>
      <div id="quotes-list"></div>
    </div>

    <div id="page-orders" class="page">
      <h1>My Orders</h1>
      <div id="orders-list"></div>
    </div>

    <div id="page-login" class="page">
      <h1>Login</h1>
      <form id="login-form" onsubmit="login(event)">
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit">Login</button>
        <p>No account? <a href="#" onclick="showPage('register')">Register here</a></p>
      </form>
    </div>

    <div id="page-register" class="page">
      <h1>Register</h1>
      <form id="register-form" onsubmit="register(event)">
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="text" id="reg-first" placeholder="First Name" required>
        <input type="text" id="reg-last" placeholder="Last Name" required>
        <input type="password" id="reg-password" placeholder="Password (min 8 chars)" required minlength="8">
        <input type="password" id="reg-password2" placeholder="Confirm Password" required minlength="8">
        <select id="reg-role">
          <option value="customer">Individual Customer</option>
          <option value="company_admin">Company Admin</option>
        </select>
        <button type="submit">Register</button>
        <p>Already have an account? <a href="#" onclick="showPage('login')">Login</a></p>
      </form>
    </div>

    <div id="page-detail" class="page">
      <button onclick="showPage('catalog')" class="btn-back">&larr; Back to Catalog</button>
      <div id="equipment-detail"></div>
    </div>

    <div id="page-quote-create" class="page">
      <button onclick="showPage('catalog')" class="btn-back">&larr; Back to Catalog</button>
      <h1>Create Quote</h1>
      <form id="quote-form" onsubmit="createQuote(event)">
        <input type="hidden" id="quote-equipment-id">
        <p>Equipment: <strong id="quote-equipment-name"></strong></p>
        <p>Daily Rate: $<span id="quote-daily-rate"></span></p>
        <label>Quantity: <input type="number" id="quote-qty" value="1" min="1" onchange="updateQuoteTotal()"></label>
        <label>Rental Days: <input type="number" id="quote-days" value="1" min="1" onchange="updateQuoteTotal()"></label>
        <label><input type="checkbox" id="quote-delivery"> Delivery Required</label>
        <p>Subtotal: $<span id="quote-subtotal">0</span></p>
        <p>Insurance (5%): $<span id="quote-insurance">0</span></p>
        <p>Delivery (10%): $<span id="quote-delivery-fee">0</span></p>
        <p><strong>Total: $<span id="quote-total">0</span></strong></p>
        <button type="submit">Create Quote</button>
        <div id="quote-result"></div>
      </form>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
