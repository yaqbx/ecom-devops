version: '3.8'

services:
  # ==================== DATABASES & CACHE ====================
  # MongoDB for Product Catalog
  mongodb:
    image: mongo:7
    container_name: equipment-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: equipment_catalog
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - equipment-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for User Management
  postgres:
    image: postgres:15-alpine
    container_name: equipment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - equipment-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Checkout Service caching
  redis:
    image: redis:7-alpine
    container_name: equipment-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - equipment-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MICROSERVICES ====================
  # Product Catalog Service (Node.js)
  product-catalog:
    build:
      context: ./product-catalog
      dockerfile: Dockerfile
    container_name: product-catalog-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/equipment_catalog
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8000,http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - equipment-network
    volumes:
      - ./product-catalog/logs:/app/logs
    command: >
      sh -c "node scripts/seed-data.js && node src/app.js"

  # User Management Service (Django)
  user-management:
    build:
      context: ./user-management
      dockerfile: Dockerfile
    container_name: user-management-api
    restart: unless-stopped
    environment:
      DEBUG: "True"
      SECRET_KEY: "dev-secret-key-change-in-production"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/user_management"
      REDIS_URL: "redis://redis:6379/0"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - equipment-network
    command: >
      sh -c "python manage.py migrate && python manage.py seed_users --password Test1234! && python manage.py runserver 0.0.0.0:8000"

  # Checkout Service (FastAPI)
  checkout-service:
    build:
      context: ./checkout-service
      dockerfile: Dockerfile
    container_name: checkout-service-api
    restart: unless-stopped
    environment:
      ENV: development
      HOST: 0.0.0.0
      PORT: 8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      PRODUCT_CATALOG_URL: "http://product-catalog:3000"
      USER_MANAGEMENT_URL: "http://user-management:8000"
      PAYMENT_MOCK_URL: "http://payment-mock:8100"
    ports:
      - "8001:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - equipment-network

  # Mock Payment Service
  payment-mock:
    build:
      context: ./payment-mock
      dockerfile: Dockerfile
    container_name: payment-mock-api
    restart: unless-stopped
    environment:
      PORT: 8100
      ENV: development
    ports:
      - "8100:8100"
    networks:
      - equipment-network

  # Frontend SPA (nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - equipment-network
    depends_on:
      - product-catalog
      - user-management
      - checkout-service

# ==================== NETWORKS & VOLUMES ====================
networks:
  equipment-network:
    driver: bridge

volumes:
  mongodb_data:
  postgres_data:
  redis_data:
