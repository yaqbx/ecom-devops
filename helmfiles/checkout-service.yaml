namespace: ecommerce
replicas: 2
image:
  repository: 163841615263.dkr.ecr.eu-north-1.amazonaws.com/checkout-service
  tag: v1.0.0-abca63e
service:
  port: 80
  targetPort: 8000
env:
  - name: ENV
    value: production
  - name: HOST
    value: 0.0.0.0
  - name: PORT
    value: "8000"
  - name: REDIS_HOST
    value: redis
  - name: REDIS_PORT
    value: "6379"
livenessProbe:
  path: /health
  port: 8000
  initialDelaySeconds: 15
  periodSeconds: 10
readinessProbe:
  path: /health
  port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
