namespace: ecommerce
replicas: 2
image:
  repository: 163841615263.dkr.ecr.eu-north-1.amazonaws.com/user-management
  tag: v1.0.0-abca63e
service:
  port: 80
  targetPort: 8000
env:
  - name: DEBUG
    value: "False"
  - name: DATABASE_URL
    valueFrom:
      configMapKeyRef:
        name: user-management-config
        key: DATABASE_URL
  - name: REDIS_URL
    valueFrom:
      configMapKeyRef:
        name: user-management-config
        key: REDIS_URL
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: user-management-secret
        key: SECRET_KEY
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
livenessProbe:
  path: /health/
  port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  path: /health/
  port: 8000
  initialDelaySeconds: 5
  periodSeconds: 5
